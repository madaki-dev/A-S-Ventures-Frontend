<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | A&S Agri</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <nav class="navbar">
    <div class="logo">
      <h2>A&S Agri-Ventures</h2>
    </div>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="marketplace.html">Marketplace</a></li>
    </ul>
  </nav>

  <section class="page-header">
    <h1>Contact Us</h1>

    <p>We'd love to hear from you.</p>
  </section>

  <section class="contact-section">
    <div class="contact-card">
      <h2>Get In Touch</h2>

      <form id="contactForm">

        <input type="text" id="contactName" placeholder="Full Name" required />

        <input type="email" id="contactEmail" placeholder="Email Address" required />

        <input type="text" id="contactSubject" placeholder="Subject" />

        <textarea id="contactMessage" placeholder="Your Message" required></textarea>

        <button type="submit">
          Send Message
        </button>

      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-content">
      <div>
        <h3>A&S Ventures</h3>
        <p>Connecting Farmers, Buyers & Markets.</p>
      </div>

      <div>
        <p>as.logistics.td@gmail.com</p>
        <p>+234 8023799337</p>
        <p>+234 9043268594</p>
      </div>
    </div>
  </footer>
  <script>

    const contactForm =
      document.getElementById("contactForm");


    contactForm.addEventListener(
      "submit",
      async function (e) {

        e.preventDefault();


        const name =
          document
            .getElementById("contactName")
            .value
            .trim();

        const email =
          document
            .getElementById("contactEmail")
            .value
            .trim();

        const subject =
          document
            .getElementById("contactSubject")
            .value
            .trim();

        const message =
          document
            .getElementById("contactMessage")
            .value
            .trim();


        // ==============================
        // VALIDATION
        // ==============================

        if (!name || !email || !message) {

          alert(
            "Please complete your name, email and message."
          );

          return;
        }


        // ==============================
        // SEND TO BACKEND
        // ==============================

        try {

          const res =
            await fetch(
              "https://a-s-ventures-backend.onrender.com/api/contact",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                  name,
                  email,
                  subject,
                  message

                })
              }
            );


          const text = await res.text();

          console.log("CONTACT SERVER RESPONSE:", text);

          let data;

          try {
            data = JSON.parse(text);
          } catch {
            throw new Error(
              `Server returned ${res.status}: ${text}`
            );
          }

          console.log(
            "CONTACT RESPONSE:",
            data
          );


          if (!res.ok) {

            alert(
              data.message ||
              "Failed to send message."
            );

            return;
          }


          // ==============================
          // SUCCESS
          // ==============================

          alert(
            "Message sent successfully! We'll get back to you soon."
          );


          contactForm.reset();


        } catch (error) {

          console.error(
            "CONTACT FORM ERROR:",
            error
          );

          alert(
            "Unable to send your message. Please try again later."
          );

        }

      }
    );

  </script>
</body>

</html>
