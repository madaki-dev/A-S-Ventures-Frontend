<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmer Dashboard | A&S Ventures</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <nav class="navbar">
    <div class="logo">
      <h2>A&S Ventures</h2>
    </div>

    <ul class="nav-links">
      <li><a href="marketplace.html">Marketplace</a></li>
      <li><a href="upload-product.html">Upload Product</a></li>
      <li><a href="farmer-orders.html">Orders</a></li>
    </ul>
  </nav>

  <section class="dashboard-header">
    <h1>Farmer Dashboard</h1>

    <p>Manage your products and orders</p>
  </section>

  <section class="dashboard-stats">
    <div class="stat-card">
      <h2>0</h2>
      <p>Products Listed</p>
    </div>

    <div class="stat-card">
      <h2>0</h2>
      <p>Orders Received</p>

      <h2>₦0</h2>
      <p>Total Revenue</p>
    </div>
  </section>

  <section class="dashboard-actions">
    <a href="upload-product.html">
      <button class="dashboard-btn">Upload New Product</button>
    </a>
  </section>

  <section class="my-products">
    <h2>My Products</h2>

    <div class="product-grid">
      <div class="product-card">
      </div>

      <div class="product-card">
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-content">
      <h3>A&S Ventures</h3>
      <p>Connecting Farmers, Buyers & Markets.</p>
    </div>
