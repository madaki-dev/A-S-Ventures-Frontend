<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Buyer Checkout | A&S Ventures</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #063006, #114711);
            color: #fff;
            margin: 0;
            padding: 0;
        }

        .checkout-container {
            max-width: 500px;
            margin: 50px auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .checkout-container::before {
            content: "";
            position: absolute;
            top: -40px;
            left: -40px;
            width: 100px;
            height: 100px;
            background: rgba(0, 128, 0, 0.3);
            border-radius: 50%;
            z-index: -1;
        }

        .checkout-container::after {
            content: "";
            position: absolute;
            bottom: -30px;
            right: -30px;
            width: 80px;
            height: 80px;
            background: rgba(0, 200, 0, 0.3);
            border-radius: 50%;
            z-index: -1;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        input,
        select {
            background: #fff;
            color: #333;
        }

        button {
            background: #0d2e0d;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #009900;
        }
    </style>
</head>

<body>
    <div class="checkout-container">
        <h1>Buyer Checkout</h1>
        <form id="checkoutForm">

            <input type="text" id="fullname" placeholder="Full Name" required />

            <input type="tel" id="phone" placeholder="Phone Number" required />

            <input type="tel" id="whatsapp" placeholder="WhatsApp Number" required />

            <select id="state" required>
                <option value="">Select Delivery State</option>

                <option value="Abia">Abia</option>
                <option value="Adamawa">Adamawa</option>
                <option value="Akwa Ibom">Akwa Ibom</option>
                <option value="Anambra">Anambra</option>
                <option value="Bauchi">Bauchi</option>
                <option value="Bayelsa">Bayelsa</option>
                <option value="Benue">Benue</option>
                <option value="Borno">Borno</option>
                <option value="Cross River">Cross River</option>
                <option value="Delta">Delta</option>
                <option value="Ebonyi">Ebonyi</option>
                <option value="Edo">Edo</option>
                <option value="Ekiti">Ekiti</option>
                <option value="Enugu">Enugu</option>
                <option value="Gombe">Gombe</option>
                <option value="Imo">Imo</option>
                <option value="Jigawa">Jigawa</option>
                <option value="Kaduna">Kaduna</option>
                <option value="Kano">Kano</option>
                <option value="Katsina">Katsina</option>
                <option value="Kebbi">Kebbi</option>
                <option value="Kogi">Kogi</option>
                <option value="Kwara">Kwara</option>
                <option value="Lagos">Lagos</option>
                <option value="Nasarawa">Nasarawa</option>
                <option value="Niger">Niger</option>
                <option value="Ogun">Ogun</option>
                <option value="Ondo">Ondo</option>
                <option value="Osun">Osun</option>
                <option value="Oyo">Oyo</option>
                <option value="Plateau">Plateau</option>
                <option value="Rivers">Rivers</option>
                <option value="Sokoto">Sokoto</option>
                <option value="Taraba">Taraba</option>
                <option value="Yobe">Yobe</option>
                <option value="Zamfara">Zamfara</option>
                <option value="FCT">FCT</option>

            </select>

            <input type="text" id="address" placeholder="Delivery Address" required />

            <div id="orderSummary">

                <p>
                    Products:
                    <strong id="productsTotal">₦0</strong>
                </p>

                <p>
                    Transportation:
                    <strong id="transportFee">₦0</strong>
                </p>

                <hr>

                <p>
                    Total:
                    <strong id="grandTotal">₦0</strong>
                </p>

            </div>

            <button type="submit">
                Proceed to Payment
            </button>

        </form>
    </div>

    <script>
        const API_URL = "https://a-s-ventures-backend.onrender.com";

        const stateSelect = document.getElementById("state");
        const checkoutForm = document.getElementById("checkoutForm");

        let productsTotal = 0;
        let transportFee = 0;


        // ==========================================
        // GET CART TOTAL
        // ==========================================

        async function loadCart() {

            const token = localStorage.getItem("token");

            if (!token) {
                alert("Please login first.");
                window.location.href = "login.html";
                return false;
            }

            try {

                const cartRes = await fetch(
                    `${API_URL}/api/cart`,
                    {
                        headers: {
                            Authorization: `Bearer ${token}`
                        }
                    }
                );

                if (cartRes.status === 401 || cartRes.status === 403) {

                    localStorage.removeItem("token");
                    localStorage.removeItem("user");

                    alert("Your login session has expired. Please login again.");
                    window.location.href = "login.html";

                    return false;
                }

                if (!cartRes.ok) {
                    throw new Error("Could not load cart.");
                }

                const cart = await cartRes.json();

                productsTotal = 0;

                cart.forEach(item => {

                    if (item.product) {

                        productsTotal +=
                            Number(item.product.sellingPrice || item.product.price || 0) *
                            Number(item.quantity || 1);

                    }

                });

                document.getElementById("productsTotal").textContent =
                    `₦${productsTotal.toLocaleString()}`;

                updateTotal();

                return true;

            } catch (error) {

                console.error("Cart error:", error);

                alert("Could not load your cart.");

                return false;
            }
        }


        // ==========================================
        // GET TRANSPORT PRICE
        // ==========================================

        stateSelect.addEventListener("change", async () => {

            const state = stateSelect.value;

            if (!state) {
                transportFee = 0;
                updateTotal();
                return;
            }

            try {

                const transportRes = await fetch(
                    `${API_URL}/api/transport/prices`
                );

                if (!transportRes.ok) {
                    throw new Error("Could not load transport prices.");
                }

                const transports = await transportRes.json();

                const transport = transports.find(
                    t => t.state === state
                );

                if (!transport) {

                    alert(
                        "Transportation price not available for this state."
                    );

                    transportFee = 0;
                    updateTotal();

                    return;
                }

                transportFee = Number(
                    transport.transportPrice || 0
                );

                document.getElementById("transportFee").textContent =
                    `₦${transportFee.toLocaleString()}`;

                updateTotal();

            } catch (error) {

                console.error(
                    "Transportation error:",
                    error
                );

                alert(
                    "Could not calculate transportation."
                );
            }

        });


        // ==========================================
        // UPDATE TOTAL
        // ==========================================

        function updateTotal() {

            const total =
                productsTotal + transportFee;

            document.getElementById("grandTotal").textContent =
                `₦${total.toLocaleString()}`;
        }


        // ==========================================
        // CHECKOUT
        // ==========================================

        checkoutForm.addEventListener("submit", async (e) => {

            e.preventDefault();

            const fullname =
                document.getElementById("fullname").value.trim();

            const phone =
                document.getElementById("phone").value.trim();

            const whatsapp =
                document.getElementById("whatsapp").value.trim();

            const state =
                document.getElementById("state").value;

            const address =
                document.getElementById("address").value.trim();

            const token =
                localStorage.getItem("token");


            // ==========================================
            // AUTH CHECK
            // ==========================================

            if (!token) {

                alert("Please login first.");

                window.location.href =
                    "login.html";

                return;
            }


            // ==========================================
            // FORM VALIDATION
            // ==========================================

            if (
                !fullname ||
                !phone ||
                !whatsapp ||
                !state ||
                !address
            ) {

                alert(
                    "Please fill in all fields."
                );

                return;
            }


            try {

                const res = await fetch(
                    `${API_URL}/api/payment/initialize`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${token}`
                        },

                        body: JSON.stringify({

                            fullname,
                            phone,
                            whatsapp,
                            state,
                            address

                        })
                    }
                );


                const data =
                    await res.json();


                // ==========================================
                // TOKEN EXPIRED / INVALID
                // ==========================================

                if (
                    res.status === 401 ||
                    res.status === 403
                ) {

                    localStorage.removeItem("token");
                    localStorage.removeItem("user");

                    alert(
                        "Your login session has expired. Please login again."
                    );

                    window.location.href =
                        "login.html";

                    return;
                }


                // ==========================================
                // OTHER ERROR
                // ==========================================

                if (!res.ok) {

                    console.error(
                        "Payment initialization failed:",
                        data
                    );

                    alert(
                        data.message ||
                        "Could not initialize payment."
                    );

                    return;
                }


                // ==========================================
                // FLUTTERWAVE
                // ==========================================

                if (!data.paymentLink) {

                    console.error(
                        "No payment link returned:",
                        data
                    );

                    alert(
                        "Payment link was not returned by the server."
                    );

                    return;
                }

                window.location.href =
                    data.paymentLink;


            } catch (error) {

                console.error(
                    "Checkout error:",
                    error
                );

                alert(
                    "Something went wrong while starting payment."
                );
            }

        });


        // ==========================================
        // LOAD CART WHEN PAGE OPENS
        // ==========================================

        loadCart();

    </script>

</body>

</html>
